<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quorum{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50:  '#eef7ff',
                            100: '#d9edff',
                            500: '#2b86ff',
                            600: '#1a6ee6',
                            700: '#1657b8',
                            900: '#0e2d5c',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="h-full text-slate-100 antialiased" hx-boost="true" hx-target="body" hx-swap="outerHTML show:no-scroll" hx-indicator="#nav-progress">
    <div id="nav-progress" class="htmx-indicator fixed top-0 left-0 right-0 h-0.5 bg-brand-500 animate-pulse z-50"></div>
    {% block body %}
    <div class="min-h-full flex flex-col">
        {% include 'partials/nav.html' %}
        <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {% block content %}{% endblock %}
        </main>
        <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
            Quorum · multi-signal FX intelligence
        </footer>
    </div>
    {% endblock %}

    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/static/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
