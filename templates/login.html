{% extends 'base.html' %}
{% block title %}Sign in · Quorum{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-semibold text-white">Welcome back</h1>
        <p class="mt-2 text-sm text-slate-400">Sign in to your Quorum account</p>
    </div>
    <div class="rounded-xl border border-slate-800 bg-slate-900/50 p-8">
        <form x-data="loginForm" @submit.prevent="submit" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1.5">Email</label>
                <input x-model="email" type="email" required
                    class="w-full rounded-md bg-slate-950 border border-slate-800 px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
                    placeholder="you@example.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1.5">Password</label>
                <input x-model="password" type="password" required
                    class="w-full rounded-md bg-slate-950 border border-slate-800 px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
                    placeholder="••••••••">
            </div>
            <template x-if="error">
                <div class="rounded-md bg-red-500/10 border border-red-500/30 px-3 py-2 text-sm text-red-400" x-text="error"></div>
            </template>
            <button type="submit" :disabled="loading"
                class="w-full rounded-md bg-brand-600 hover:bg-brand-500 disabled:opacity-50 disabled:cursor-not-allowed px-4 py-2 text-sm font-medium text-white transition">
                <span x-show="!loading">Sign in</span>
                <span x-show="loading">Signing in...</span>
            </button>
        </form>
        <p class="mt-6 text-center text-sm text-slate-400">
            No account? <a href="/register" class="text-brand-500 hover:text-brand-400 font-medium">Create one</a>
        </p>
    </div>
</div>
{% endblock %}
