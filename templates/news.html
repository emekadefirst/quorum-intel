{% extends 'base.html' %}
{% block title %}News · Quorum{% endblock %}

{% block content %}
<div x-data="newsPage" class="space-y-6">
    <div>
        <h1 class="text-3xl font-semibold text-white">News digest</h1>
        <p class="mt-2 text-sm text-slate-400">
            Headlines scored for GBP/USD relevance. Priority = relevance × recency decay.
        </p>
    </div>

    <template x-if="loading">
        <div class="rounded-xl border border-slate-800 bg-slate-900/50 p-6 text-sm text-slate-500">
            Fetching feeds...
        </div>
    </template>

    <template x-if="error">
        <div class="rounded-xl border border-red-500/30 bg-red-500/10 p-4 text-sm text-red-400" x-text="error"></div>
    </template>

    <template x-if="!loading && digest">
        <div class="space-y-6">
            <!-- Meta row -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="rounded-xl border border-slate-800 bg-slate-900/50 p-4">
                    <p class="text-xs uppercase tracking-wider text-slate-500">Sources OK</p>
                    <p class="text-xl font-semibold text-white mt-1" x-text="digest.meta.sources_ok + '/' + digest.meta.sources_total"></p>
                </div>
                <div class="rounded-xl border border-slate-800 bg-slate-900/50 p-4">
                    <p class="text-xs uppercase tracking-wider text-slate-500">Raw items</p>
                    <p class="text-xl font-semibold text-white mt-1" x-text="digest.meta.raw_items"></p>
                </div>
                <div class="rounded-xl border border-slate-800 bg-slate-900/50 p-4">
                    <p class="text-xs uppercase tracking-wider text-slate-500">Relevant</p>
                    <p class="text-xl font-semibold text-white mt-1" x-text="digest.meta.relevant_items_returned"></p>
                </div>
                <div class="rounded-xl border border-slate-800 bg-slate-900/50 p-4">
                    <p class="text-xs uppercase tracking-wider text-slate-500">Lookback</p>
                    <p class="text-xl font-semibold text-white mt-1" x-text="digest.meta.lookback_hours + 'h'"></p>
                </div>
            </div>

            <!-- Items -->
            <div class="rounded-xl border border-slate-800 bg-slate-900/50 p-6">
                <h2 class="text-lg font-semibold text-white mb-4">Headlines</h2>
                <template x-if="digest.items.length === 0">
                    <p class="text-sm text-slate-500">No relevant items in window.</p>
                </template>
                <ul class="divide-y divide-slate-800">
                    <template x-for="item in digest.items" :key="item.id">
                        <li class="py-4 first:pt-0 last:pb-0">
                            <div class="flex items-start justify-between gap-4">
                                <div class="flex-1">
                                    <a :href="item.url" target="_blank" rel="noopener"
                                       class="text-slate-100 hover:text-brand-400 font-medium" x-text="item.title"></a>
                                    <template x-if="item.summary">
                                        <p class="mt-1 text-sm text-slate-400 line-clamp-2" x-text="item.summary"></p>
                                    </template>
                                    <div class="mt-2 flex items-center gap-2 flex-wrap text-xs">
                                        <span class="text-slate-500" x-text="item.source"></span>
                                        <span class="text-slate-700">·</span>
                                        <span class="text-slate-500" x-text="item.age_hours != null ? item.age_hours.toFixed(1) + 'h ago' : ''"></span>
                                        <template x-for="t in item.topics" :key="t">
                                            <span class="inline-block px-2 py-0.5 rounded bg-slate-800 text-slate-300" x-text="t.replaceAll('_', ' ')"></span>
                                        </template>
                                    </div>
                                </div>
                                <div class="text-right shrink-0">
                                    <p class="text-sm font-semibold text-brand-500" x-text="item.priority"></p>
                                    <p class="text-xs text-slate-500">priority</p>
                                </div>
                            </div>
                        </li>
                    </template>
                </ul>
            </div>
        </div>
    </template>
</div>
{% endblock %}
