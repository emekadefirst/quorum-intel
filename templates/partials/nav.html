<nav x-data="{ open: false }" class="border-b border-slate-800 bg-slate-900/60 backdrop-blur">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 items-center justify-between">
            <div class="flex items-center gap-8">
                <a href="/" class="flex items-center gap-2 text-lg font-semibold tracking-tight">
                    <span class="inline-block h-2.5 w-2.5 rounded-full bg-brand-500"></span>
                    <span>Quorum</span>
                </a>
                <div class="hidden md:flex items-center gap-1">
                    {% set nav_items = [('/', 'Dashboard', 'dashboard'), ('/signals', 'Signals', 'signals'), ('/news', 'News', 'news')] %}
                    {% for href, label, key in nav_items %}
                        <a href="{{ href }}"
                           class="px-3 py-2 rounded-md text-sm font-medium {% if page == key %}bg-slate-800 text-white{% else %}text-slate-400 hover:text-white hover:bg-slate-800{% endif %}">
                            {{ label }}
                        </a>
                    {% endfor %}
                </div>
            </div>
            <div class="hidden md:flex items-center gap-3" x-data="auth">
                <template x-if="user">
                    <div class="flex items-center gap-3">
                        <span class="text-sm text-slate-400" x-text="user?.name"></span>
                        <button @click="logout()" class="text-sm text-slate-400 hover:text-white">Logout</button>
                    </div>
                </template>
                <template x-if="!user">
                    <div class="flex items-center gap-2">
                        <a href="/login" class="px-3 py-1.5 rounded-md text-sm text-slate-300 hover:text-white">Sign in</a>
                        <a href="/register" class="px-3 py-1.5 rounded-md text-sm bg-brand-600 hover:bg-brand-500 text-white font-medium">Get started</a>
                    </div>
                </template>
            </div>
            <button @click="open = !open" class="md:hidden text-slate-400 hover:text-white">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
        </div>
        <div x-show="open" x-cloak class="md:hidden pb-3 space-y-1">
            {% for href, label, key in nav_items %}
                <a href="{{ href }}" class="block px-3 py-2 rounded-md text-sm {% if page == key %}bg-slate-800 text-white{% else %}text-slate-400 hover:text-white hover:bg-slate-800{% endif %}">{{ label }}</a>
            {% endfor %}
        </div>
    </div>
</nav>
